name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_VERSION: "3.2.1"

jobs:
  test:
    name: Lint, types, tests with Redis 8 (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      redis:
        image: redis:8.2
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    env:
      LLMROUTER_TEST_REDIS: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz | tar xz
          echo "$PWD/prometheus-${PROMETHEUS_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests (routing, cache scoping, cascade, task accounting, rules, dashboard)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  replay:
    name: Replay held-out traffic through the gateway with the committed router
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8.2
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[embed,dev]"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            data
          key: replay-data-v1
      - name: Replay 500 prompts under four policies
        run: |
          llmrouter replay --config gateway.yaml --redis redis://127.0.0.1:6379/0 --limit 500 --out replay.md
          cat replay.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import re
          rows = {m.group(1): float(m.group(2)) for m in re.finditer(r"^\| (always large|router) \|.*?\| \$([0-9.]+) \|", open("replay.md").read(), re.M)}
          assert rows["router"] < 0.8 * rows["always large"], rows
          print("router saves", 1 - rows["router"] / rows["always large"])
          PY

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t llm-router-cost-telemetry:ci .
      - run: |
          docker run --rm --entrypoint llmrouter llm-router-cost-telemetry:ci --version
          docker run --rm --entrypoint id llm-router-cost-telemetry:ci -u | grep -q 10001

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit --skip-editable
