# Gateway, Redis 8 (vector search for the semantic cache), Prometheus with the rules, Grafana on :3000.
# Point the tiers in gateway.yaml at your OpenAI-compatible backends (vLLM, a hosted API, LiteLLM...).
services:
  redis:
    image: redis:8.2
  gateway:
    build: .
    volumes: ["./gateway.yaml:/app/gateway.yaml:ro"]
    environment:
      SMALL_LLM_API_KEY: ${SMALL_LLM_API_KEY:-}
      LARGE_LLM_API_KEY: ${LARGE_LLM_API_KEY:-}
    ports: ["8080:8080"]
    depends_on: [redis]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.5.2
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
